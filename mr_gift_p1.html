
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Experience Certificate - Static Reference</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .serif { font-family: 'Playfair Display', serif; }
        .gold-shimmer {
            background: linear-gradient(90deg, #b08d57 0%, #e5c185 50%, #b08d57 100%);
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body class="p-8">
    <div class="max-w-3xl mx-auto bg-[#0b1220] border border-[#2b3447] rounded-2xl shadow-2xl overflow-hidden">
        <div class="h-1.5 gold-shimmer"></div>
        <div class="p-10">
            <div class="text-center mb-8">
                <h1 class="serif text-3xl font-bold tracking-[0.2em] uppercase">Private Experience Certificate</h1>
                <p class="text-xs tracking-widest text-[#94a3b8] mt-2 uppercase">Dining & Transportation — Louisville, KY</p>
            </div>
            
            <div class="space-y-6">
                <div>
                    <p class="text-[10px] uppercase tracking-widest text-[#94a3b8]">Issued To</p>
                    <h2 class="text-2xl font-bold text-[#cbd5e1]">Kathy Ruggiero & Maureen Somervell</h2>
                </div>

                <div class="bg-[#0f1b31] p-6 rounded-xl border border-[#243044]">
                    <p class="text-[10px] uppercase tracking-widest text-[#94a3b8] mb-2">Validity Period</p>
                    <p class="serif text-xl font-bold">February 1 – February 31, 2026</p>
                </div>

                <div class="pt-8 border-t border-[#243044] flex justify-between items-end">
                    <div>
                        <p class="text-[10px] uppercase tracking-widest text-[#94a3b8]">Authorized By</p>
                        <p class="font-bold">Private Concierge Services</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] uppercase tracking-widest text-[#94a3b8] mb-4">Signature</p>
                        <div class="w-40 h-px bg-[#3b4760] mb-2"></div>
                        <p class="serif italic text-2xl">Mark</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <p class="text-center text-xs text-[#64748b] mt-8 italic">Static Reference Copy</p>
</body>
</html>
