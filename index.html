<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Experience Certificate</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  
  <!-- Standard Tailwind CSS (v2 CDN for layout utilities) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  
  <style>
    /* Custom Theme Colors & Variables */
    :root {
      --primary: #0f172a;
      --secondary: #0b1220;
      --accent: #b08d57;
      --accent-hover: #e5c185;
      --border: #2b3447;
      --border-light: #243044;
      --text-muted: #94a3b8;
      --text-light: #f8fafc;
      --text-main: #e2e8f0;
      --card-bg: #0b1220;
      --box-bg: #0f1b31;
    }

    /* Global Base Styles */
    body {
      background-color: var(--primary);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background-color: var(--accent);
      color: var(--primary);
    }

    /* Custom Typography */
    .serif { font-family: 'Playfair Display', serif; }
    .signature-font { font-family: 'Dancing Script', cursive; }

    /* Custom Utility Classes (Mapping JIT-style classes used in JSX) */
    .bg-\[\#0f172a\] { background-color: var(--primary); }
    .bg-\[\#0b1220\] { background-color: var(--secondary); }
    .bg-\[\#0b1220\]\/50 { background-color: rgba(11, 18, 32, 0.5); }
    .bg-\[\#0f1b31\] { background-color: var(--box-bg); }
    .bg-\[\#080d1a\] { background-color: #080d1a; }
    .bg-\[\#b08d57\] { background-color: var(--accent); }
    .bg-\[\#b08d57\]\/10 { background-color: rgba(176, 141, 87, 0.1); }
    .bg-\[\#b08d57\]\/20 { background-color: rgba(176, 141, 87, 0.2); }
    .bg-\[\#1e293b\] { background-color: #1e293b; }
    
    .text-\[\#e2e8f0\] { color: var(--text-main); }
    .text-\[\#cbd5e1\] { color: #cbd5e1; }
    .text-\[\#94a3b8\] { color: var(--text-muted); }
    .text-\[\#f8fafc\] { color: var(--text-light); }
    .text-\[\#b08d57\] { color: var(--accent); }
    .text-\[\#0f172a\] { color: var(--primary); }
    .text-\[\#64748b\] { color: #64748b; }
    
    .border-\[\#2b3447\] { border-color: var(--border); }
    .border-\[\#243044\] { border-color: var(--border-light); }
    .border-\[\#b08d57\]\/30 { border-color: rgba(176, 141, 87, 0.3); }
    .border-\[\#b08d57\]\/40 { border-color: rgba(176, 141, 87, 0.4); }
    .border-\[\#b08d57\]\/50 { border-color: rgba(176, 141, 87, 0.5); }
    .border-\[\#2d3748\] { border-color: #2d3748; }
    .border-\[\#3b4760\] { border-color: #3b4760; }

    .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
    .shadow-\[\#b08d57\]\/20 { box-shadow: 0 20px 25px -5px rgba(176, 141, 87, 0.2); }

    /* Custom Gradients */
    .bg-gradient-to-b { background-image: linear-gradient(to bottom, var(--tw-gradient-stops)); }
    .bg-gradient-to-r { background-image: linear-gradient(to right, var(--tw-gradient-stops)); }
    .from-transparent { --tw-gradient-from: transparent; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, transparent); }
    .via-\[\#b08d57\] { --tw-gradient-stops: var(--tw-gradient-from), #b08d57, var(--tw-gradient-to, rgba(176, 141, 87, 0)); }
    .to-transparent { --tw-gradient-to: transparent; }
    .from-\[\#b08d57\] { --tw-gradient-from: #b08d57; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, rgba(176, 141, 87, 0)); }

    /* Shimmer Effect */
    .gold-shimmer {
      background: linear-gradient(90deg, #b08d57 0%, #e5c185 50%, #b08d57 100%);
      background-size: 200% 100%;
      animation: gold-shimmer-anim 3s infinite linear;
    }

    @keyframes gold-shimmer-anim {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* Animation Utilities */
    .animate-in { animation: fade-in 0.5s ease-out forwards; }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .animate-bounce { animation: bounce 1s infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8, 0, 1, 1); }
      50% { transform: translateY(0); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--secondary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  </style>

  <script type="importmap">
  {
    "imports": {
      "react/": "https://esm.sh/react@^19.2.3/",
      "react": "https://esm.sh/react@^19.2.3",
      "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
      "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
      "vite": "https://esm.sh/vite@^7.3.0",
      "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
